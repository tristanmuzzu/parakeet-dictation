name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-atspi-2.0 libportaudio2
      - name: Isolated Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt pytest
      - name: Synthetic regression suite
        run: .venv/bin/python -m pytest tests/ -q
      - name: Compile source
        run: .venv/bin/python -m compileall -q *.py tools
